kind = "web"
previewPath = "/"
title = "FlowDesk AI"
version = "1.0.0"
id = "artifacts/flowdesk-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19203

[services.development]
run = "pnpm --filter @workspace/flowdesk-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowdesk-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/flowdesk-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19203"
BASE_PATH = "/"
